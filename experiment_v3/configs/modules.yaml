- id: M1
  name_ru: Интеграция производства и WMS
  scope: Основание, состав и изменения поступления передаются из производственного/учётного
    источника
  operations: P01–P05
- id: M2
  name_ru: Интеграция качества и WMS
  scope: Доставка и применение уполномоченного решения качества без изменения методики
    контроля
  operations: P06–P11
- id: M3
  name_ru: Сквозное оформление и закрытие в WMS
  scope: Повторное использование доступных данных, валидация, документы, подтверждения
    и информационное закрытие
  operations: P12–P16; P22–P25
- id: M4
  name_ru: Правила адресации и диспетчеризация
  scope: Допустимые места, резервирование, назначение задания и исполнителя с учётом
    ограничений и ожидания
  operations: P17–P21
- id: M5
  name_ru: Автоматическая регистрация поступления IoT
  scope: Стационарное считывание и подтверждение физического прибытия с резервом через
    ТСД
  operations: P02–P05
- id: M6
  name_ru: IoT-состояние приёмочной зоны в управлении
  scope: Вход/выход, физическая занятость, актуальность наблюдений и использование
    их в решениях
  operations: P10; P17–P20
- id: M7
  name_ru: Локальный ML-прогноз для управления
  scope: Замена простого прогноза поступлений по зонам на обучаемый прогноз при неизменной
    политике действий
  operations: P17–P18
