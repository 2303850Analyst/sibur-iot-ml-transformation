name: wms32-live
services:
  db:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment: {POSTGRES_USER: odoo, POSTGRES_PASSWORD: "${DB_PASSWORD:?}"}
    volumes: [state:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  odoo:
    image: odoo:19.0@sha256:49c9d2a9935f07f15e2404ce8649a84c4f0d4e70a880f7209ad27a19ab415f77
    environment: {HOST: db, USER: odoo, PASSWORD: "${DB_PASSWORD:?}", TSD_PASSWORD: "${TSD_PASSWORD:?}"}
    depends_on: {db: {condition: service_healthy}}
    command: [odoo,-d,wms32_trial,'--db-filter=^wms32_trial$',--no-database-list,'--workers=2','--max-cron-threads=0','--addons-path=/mnt/legacy,/mnt/extra-addons,/v32/extra']
    ports: ['127.0.0.1:18132:8069']
    volumes: ['../../../odoo_addons:/mnt/legacy:ro','../../odoo_addons:/mnt/extra-addons:ro','../../live:/lab:ro','.:/v32:ro',filestore:/var/lib/odoo]
  broker:
    image: eclipse-mosquitto:2@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
    ports: ['127.0.0.1:18932:1883']
    volumes: ['./broker.conf:/mosquitto/config/mosquitto.conf:ro']
volumes:
  state:
  filestore:


