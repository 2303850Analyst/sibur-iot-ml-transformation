<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Терминал приёмки</title>
<style>body{font:18px system-ui;max-width:32rem;margin:2rem auto;padding:1rem}label,button{display:block;margin:.8rem 0}input,select,button{font:inherit;width:100%;padding:.4rem;box-sizing:border-box}output{white-space:pre-wrap}</style>
<h1>Терминал приёмки</h1><form><label>Поступление<input name="receipt" required></label><label>Паллета<input name="pallet" required></label><label>Адрес задания<input name="address"></label><label>Действие<select name="op"><option value="2">Считать идентификатор</option><option value="16">Оприходовать</option><option value="17">Назначить адрес</option><option value="18">Подтвердить перевозку</option><option value="19">Подтвердить установку</option><option value="20">Проверить результат</option><option value="21">Проверить расхождение</option></select></label><button>Записать</button></form><output aria-live="polite"></output>
<script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),n=Number(f.get('op')),p=f.get('pallet');const msg={case:f.get('receipt'),version:1,operation:n,role:n===17?'dispatch':[18,19].includes(n)?'driver':'operator',event_id:crypto.randomUUID(),data:{pallet:p,barcode:p,address:f.get('address')}};try{const r=await fetch('/v3/step',{method:'POST',body:new URLSearchParams({csrf_token:'TOKEN_VALUE',message:JSON.stringify(msg)})});document.querySelector('output').textContent=JSON.stringify(await r.json(),null,2)}catch{document.querySelector('output').textContent='Не удалось получить ответ сервера'}}</script></html>
