name: psv-user-prototype
services:
  db:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: postgres
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U odoo -d postgres']
      interval: 2s
      timeout: 2s
      retries: 60
  broker:
    image: eclipse-mosquitto:2@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt:/mosquitto/data
  odoo:
    image: odoo:19.0@sha256:49c9d2a9935f07f15e2404ce8649a84c4f0d4e70a880f7209ad27a19ab415f77
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD:?}
      TSD_PASSWORD: ${TSD_PASSWORD:?}
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:?}
      QUALITY_PASSWORD: ${QUALITY_PASSWORD:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    command: [odoo, '-d', wms_reference, '--db-filter=^wms_reference$', '--no-database-list', '--max-cron-threads=0']
    ports: ['127.0.0.1::8069']
    volumes:
      - odoo:/var/lib/odoo
      - ./odoo_addons:/mnt/extra-addons:ro
      - ./scripts:/lab/scripts:ro
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
  gateway:
    image: psv-prototype-gateway:v1
    build: {context: ., target: gateway}
    environment:
      ODOO_URL: http://odoo:8069
      MQTT_HOST: broker
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:?}
      PYTHONUNBUFFERED: 1
    command: [python, scripts/gateway.py]
    volumes:
      - ./scripts:/lab/scripts:ro
      - gateway:/lab/outbox
  sensor:
    image: psv-prototype-gateway:v1
    command: [python, scripts/sensor.py]
    volumes: [./scripts:/lab/scripts:ro]
volumes:
  db:
  odoo:
  mqtt:
  gateway:
